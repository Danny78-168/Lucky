<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專屬輪盤抽獎</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            text-align: center;
            padding-top: 50px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 30px;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .input-section {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        input[type="text"] {
            padding: 12px 20px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #d4af37;
            color: #fff;
            border-radius: 8px;
            outline: none;
            width: 280px;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        input[type="text"]::placeholder {
            color: #aaa;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #555;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .wheel-container {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 0 auto;
            border-radius: 50%;
            border: 8px solid #333;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.4) inset;
            background: #111;
        }

        /* 外圈發光裝飾 */
        .wheel-container::before {
            content: '';
            position: absolute;
            top: -12px; left: -12px; right: -12px; bottom: -12px;
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff3366;
            z-index: 10;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -40px;
            left: -15px;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #cc0033;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); 
        }

        .result-section {
            margin-top: 40px;
            font-size: 28px;
            font-weight: 900;
            min-height: 40px;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(212, 175, 55, 0.8); }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <h1>✨ 專屬幸運輪盤 ✨</h1>
    
    <div class="input-section">
        <input type="text" id="serialInput" placeholder="請輸入抽獎序號 (例: VIP01)" autocomplete="off">
        <button id="spinBtn">立即抽獎</button>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
    </div>

    <div class="result-section" id="resultDisplay"></div>

    <script>
        // 換上更具質感的莫蘭迪色/深色調搭配金色文字
        const prizes = [
            { text: '1u', color: '#2c3e50' },
            { text: '8u', color: '#e74c3c' },
            { text: '18u', color: '#34495e' },
            { text: '28u', color: '#d35400' },
            { text: '38u', color: '#16a085' },
            { text: '58u', color: '#8e44ad' },
            { text: '88u', color: '#f39c12' }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const serialInput = document.getElementById('serialInput');
        const resultDisplay = document.getElementById('resultDisplay');

        const numSlices = prizes.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentRotation = 0;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX;

            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle - Math.PI / 2;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = prizes[i].color;
                ctx.fill();
                
                // 增加扇形分隔線
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#222';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                // 文字改為亮色系
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px "Noto Sans TC"';
                
                // 為文字增加陰影增加層次感
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                ctx.fillText(prizes[i].text, radius - 40, 8);
                ctx.restore();
            }
            
            // 畫中心點裝飾圓
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, 2 * Math.PI);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#d4af37';
            ctx.stroke();
        }

        drawWheel();

        spinBtn.addEventListener('click', async () => {
            const serialCode = serialInput.value.trim();

            if (!serialCode) {
                alert('請先輸入抽獎序號！');
                return;
            }

            spinBtn.disabled = true;
            resultDisplay.innerText = "驗證中...";
            resultDisplay.style.animation = "none";

            try {
                const response = await fetch('https://lucky-1-138i.onrender.com/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serial: serialCode })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.detail);
                    spinBtn.disabled = false;
                    resultDisplay.innerText = "";
                    return;
                }

                resultDisplay.innerText = "幸運轉動中...";

                const winningIndex = data.index;
                const prizeWon = data.prize;
                const spins = 8; // 增加旋轉圈數讓動畫更刺激
                const degreesPerSlice = 360 / numSlices;
                
                const targetRotation = currentRotation 
                                     + (360 * spins) 
                                     + (360 - (currentRotation % 360)) 
                                     - (winningIndex * degreesPerSlice) 
                                     - (degreesPerSlice / 2); 

                currentRotation = targetRotation;
                canvas.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    resultDisplay.innerText = `🎉 恭喜獲得：${prizeWon} 🎉`;
                    resultDisplay.style.animation = "pulse 2s infinite";
                }, 4000);

            } catch (error) {
                alert('連線伺服器失敗，請檢查網路或後端狀態。');
                spinBtn.disabled = false;
                resultDisplay.innerText = "";
            }
        });
    </script>
</body>
</html>
